# .github/workflows/claude-auto-merge.yml
#
# Hands-off PR pipeline: Claude reviews every ready PR that TheRedJa or
# itzzjustmateo opens against main, resolves merge conflicts and fixes code
# quality issues, waits for CI, and squash-merges. When a conflict or fix
# would change functionality substantially, or the PR touches a sensitive
# area, it comments what a human needs to decide, adds "needs-human", and
# does not merge. Label a PR "no autoreview" to keep Claude off it entirely.

name: Claude auto-review and merge

# pull_request_target rather than pull_request: GitHub does not run
# pull_request workflows for PRs that conflict with their base, and resolving
# those conflicts is the point of this workflow. pull_request_target runs the
# workflow file from main with a write token and secrets while checking out
# the PR's code, so the gates below must only admit trusted authors from this
# repository.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write # dispatch the post-merge workflows
  checks: read

jobs:
  review-and-merge:
    # Safety gates:
    #  - skip drafts
    #  - only PRs from this repo (never forks)
    #  - only PRs opened by TheRedJa or itzzjustmateo
    #  - skip runs triggered by Claude's own pushes (prevents loops)
    #  - skip PRs labelled "no autoreview"
    #  - on unlabeled, only react to "no autoreview" or "needs-human" being
    #    removed, so removing an unrelated label does not start a run
    if: >
      github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["TheRedJa", "itzzjustmateo"]'), github.event.pull_request.user.login) && github.actor != 'claude[bot]' && !contains(github.event.pull_request.labels.*.name, 'no autoreview') && (github.event.action != 'unlabeled' ||
       contains(fromJSON('["no autoreview", "needs-human"]'), github.event.label.name))

    # Job-level (not workflow-level) so Claude's own pushes, which are
    # skipped by the `if` above, don't cancel the run that made them.
    concurrency:
      group: claude-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Node 24 + pnpm with a frozen-lockfile install, same as the other workflows.
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Claude GitHub App rejects the OIDC token of pull_request_target
          # runs, so use the workflow token instead. Pushes made with it don't
          # start CI, which is why the merge step below dispatches pr.yml.
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(gh pr:*),Bash(gh run:*),Bash(git:*),Bash(pnpm install),Bash(pnpm check),Bash(pnpm fix),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm test:*),Bash(pnpm lint:md),Read,Edit,Write,Glob,Grep"
          prompt: |
            You are the automated review and merge agent for ${{ github.repository }}.
            Your job: get PR #${{ github.event.pull_request.number }} into a mergeable state,
            or hand it to a human with a clear explanation. You do not merge and you do not
            wait for CI: once you finish, a later workflow step waits for the required checks
            and squash-merges the PR unless it has the `needs-human` label.
            Every run must end in exactly one of two ways: a review summary comment (ready to
            merge) or an escalation (label + comment). Never end silently. If a command you
            need is not allowed, ESCALATE and name the command.
            Follow the project's rules in AGENTS.md. Work through these steps in order.

            0. CHECK FOR AN EARLIER ESCALATION
               If the PR already has the `needs-human` label, read your most recent
               escalation comment (`gh pr view ${{ github.event.pull_request.number }} --comments`).
               Keep going through the steps below. If the reason no longer applies, remove the
               label with `gh pr edit ${{ github.event.pull_request.number }} --remove-label needs-human`
               before merging. If it still applies, do not post the same comment again.

            1. RESOLVE CONFLICTS WITH MAIN
               Run `git fetch origin main && git merge origin/main`.
               If `package.json` or `pnpm-lock.yaml` changed, run `pnpm install` afterwards
               (for a conflicted `pnpm-lock.yaml`, take main's version first, then run it).
               Resolve conflicts yourself whenever both sides' intent can be kept without
               substantially rewriting either side: imports, lockfiles, formatting, generated
               files such as `src/routeTree.gen.ts`, renamed or moved code, and both sides
               adding unrelated changes near each other. Commit the merge.
               If resolving would mean choosing between two different behaviours, rewriting
               logic from either side, or making other significant changes, run
               `git merge --abort` and ESCALATE. List the conflicting files and describe for
               each what the two sides do and what decision is needed.

            2. REVIEW AND FIX
               Read `gh pr diff ${{ github.event.pull_request.number }}` and the surrounding code.
               Fix bugs, code quality issues, lint, format and type errors, and missing or broken
               tests directly. Keep the PR's intent and scope.
               If a fix would substantially change functionality or public behaviour, do not
               make it. ESCALATE and describe the problem and the fix you propose instead.
               Smaller fixes you made along the way should still be pushed.

            3. TEST
               Run the project's checks:
               - `pnpm check`      (Ultracite lint + format check; `pnpm fix` auto-fixes)
               - `pnpm typecheck`  (tsc --noEmit)
               - `pnpm test`       (Vitest)
               - `pnpm lint:md`    (markdownlint)
               Fix the code, never the rules: do not disable or loosen a lint rule to get
               a check to pass. If still failing after 2 attempts, ESCALATE.

            4. PUSH
               If you changed anything, commit with a clear Conventional Commits message and
               `git push`. Never force-push. Never push to main directly.

            5. FINISH
               If you did not escalate, remove `needs-human` if the PR still has it, then post
               one short PR comment summarizing what you checked and anything you fixed or
               resolved, ending with "Merging once required checks pass."

            ESCALATE (do not merge) when any of these are true:
            - a conflict cannot be resolved without significant changes (see step 1)
            - a fix would substantially change functionality or public behaviour (see step 2)
            - tests or CI still failing after 2 fix attempts
            - a fix would require changing a public API, a DB schema or migration
            - changes touch secrets, permissions, or payments
            - you are unsure whether merging is safe
            - changes touch database migrations or schema: `drizzle/`, `src/db/schema.ts`,
              `drizzle.config.ts`, or seed scripts in `scripts/`
            - changes touch auth or bot protection: `src/lib/auth*`, `src/lib/turnstile*`,
              `src/routes/api/auth/`, `src/components/turnstile-widget.tsx`
            - changes touch webhooks, file storage, uploads or downloads: `server/routes/webhooks.ts`,
              `src/lib/storage.ts`, `src/lib/upload-*`, `src/lib/project-access.ts`, `src/routes/api/`
            - changes touch environment or deployment config: `env.config.ts`, `server/env.ts`,
              `.env*`, `Dockerfile`, `docker/`, `compose*.yaml`, `docker-compose.yml`, `justfile`,
              `mise.toml`
            - changes touch tooling or CI config: `.github/`, `.husky/`, `oxlint.config.ts`,
              `oxfmt.config.ts`, `tsconfig.json`, `vite.config.ts`, `vitest.config.ts`,
              `.markdownlint*`, `pnpm-workspace.yaml`
            - changes add, remove, or major-bump a dependency in `package.json`
            - changes the release stage of the `version` in `package.json` (e.g. ALPHA to BETA)
            For sensitive areas, still resolve conflicts and fix issues as above; only the
            merge is left to a human.
            To escalate: push any safe fixes you already made, run
            `gh pr edit ${{ github.event.pull_request.number }} --add-label needs-human`, post one
            comment explaining exactly what is wrong and what decision a human needs to make,
            then stop.

      # Deterministic merge: wait for the required checks on the PR head and
      # squash-merge, unless Claude escalated. Claude's pushes use the workflow
      # token and don't start CI, and GitHub doesn't run pull_request workflows
      # for conflicting PRs, so start pr.yml and docs.yml here if the required
      # checks are missing on the head commit.
      - name: Merge once required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Must match the required status checks in main's branch protection.
          REQUIRED_CHECKS: Quality checks,Docker build
        run: |
          escalate() {
            gh pr edit "$PR_NUMBER" --add-label needs-human
            gh pr comment "$PR_NUMBER" --body "$1"
            exit 0
          }

          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $state; nothing to merge."
            exit 0
          fi
          held=$(gh pr view "$PR_NUMBER" --json labels \
            --jq '[.labels[].name | select(. == "needs-human" or . == "no autoreview")] | length')
          if [ "$held" != "0" ]; then
            echo "PR #$PR_NUMBER is labelled for a human; not merging."
            exit 0
          fi
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)

          # Latest check run per required name on the head commit:
          # "missing", "pending", "success" or the failing conclusion.
          check_states() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --jq '
                (env.REQUIRED_CHECKS | split(",")) as $required
                | [.check_runs[] | select(.name as $n | $required | index($n))] as $runs
                | $required[]
                | . as $name
                | ([$runs[] | select(.name == $name)] | sort_by(.started_at) | last) as $run
                | if $run == null then "\($name)\tmissing"
                  elif $run.status != "completed" then "\($name)\tpending"
                  else "\($name)\t\($run.conclusion)" end'
          }

          if check_states | grep -q $'\tmissing$'; then
            echo "Required checks missing on $sha; dispatching CI on $HEAD_REF."
            gh workflow run pr.yml --ref "$HEAD_REF"
            gh workflow run docs.yml --ref "$HEAD_REF"
          fi

          deadline=$((SECONDS + 30 * 60))
          while :; do
            states=$(check_states)
            echo "$states"
            failed=$(awk -F'\t' '$2 != "success" && $2 != "pending" && $2 != "missing" {print $1}' <<<"$states")
            if [ -n "$failed" ]; then
              escalate "Required checks failed on $sha: $(paste -sd, <<<"$failed"). Not merging; push a fix and the review runs again. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER/checks"
            fi
            if ! grep -qvP '\tsuccess$' <<<"$states"; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              escalate "Required checks did not finish within 30 minutes on $sha. Not merging."
            fi
            sleep 30
          done

          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$sha"

          # Merges made with GITHUB_TOKEN don't fire push events, so start the
          # post-merge workflows on main explicitly; workflow_dispatch is exempt.
          gh workflow run main.yml --ref main
          gh workflow run docs.yml --ref main
